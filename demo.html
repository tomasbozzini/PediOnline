<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pizzería · Pedí por WhatsApp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Zilla+Slab:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --marfil:#FAF2E6;          /* fondo general */
    --terracota:#C0432C;       /* header / primario */
    --terracota-osc:#8F2C1C;   /* sombras */
    --albahaca:#3F6B43;        /* verde secundario */
    --mostaza:#E0A02E;         /* acento precios/CTA */
    --mostaza-osc:#B97F1E;     /* sombra botón */
    --cacao:#3B2A20;           /* títulos oscuros */
    --texto2:#8A7D68;          /* texto secundario */
    --borde:#ECDCC4;           /* bordes suaves */
    --blanco:#FFFFFF;          /* cards */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:'Mulish',system-ui,sans-serif;
    background:var(--marfil);
    color:var(--cacao);
    padding-bottom:96px;
  }
  button{font-family:inherit;cursor:pointer;border:none;background:none;touch-action:manipulation}
  button:focus-visible, a:focus-visible{
    outline:3px solid var(--albahaca); outline-offset:2px;
  }

  /* ====== Cinta mantel a cuadros diagonal (firma visual) ====== */
  .mantel{
    height:14px;
    background-image:repeating-linear-gradient(45deg, var(--terracota) 0 10px, #E8B9AC 10px 20px);
  }

  /* ====== Header ====== */
  header{
    background:var(--terracota);
    color:var(--marfil);
    text-align:center;
    padding:26px 16px 22px;
  }
  .logo{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:clamp(2.1rem,9vw,2.6rem);
    line-height:1.05;
    text-shadow:2px 2px 0 var(--terracota-osc);
  }
  .tagline{
    margin-top:7px;
    font-weight:700;
    font-size:13px;
    color:#F3D2C8;
  }
  .datos{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:16px;
  }
  .datos span{
    background:var(--terracota-osc);
    padding:5px 12px;
    border-radius:999px;
    font-size:12px;
    font-weight:700;
  }

  /* ====== Navegación de categorías (sticky) ====== */
  nav{
    position:sticky;
    top:0;
    z-index:30;
    background:var(--marfil);
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
    transition:box-shadow .2s;
  }
  nav.pegada{box-shadow:0 4px 14px rgba(60,40,20,.12)}
  nav::-webkit-scrollbar{display:none}
  .tabs{
    display:flex;
    gap:8px;
    padding:12px 16px;
    width:max-content;
  }
  .tab{
    padding:8px 16px;
    border-radius:10px;
    font-weight:800;
    font-size:13px;
    color:#6B5E48;
    background:var(--blanco);
    border:1px solid #E6D4BC;
    white-space:nowrap;
    transition:background .15s,color .15s,border-color .15s;
  }
  .tab.activa{
    background:var(--albahaca);
    border-color:var(--albahaca);
    color:var(--marfil);
  }

  /* ====== Secciones ====== */
  main{max-width:680px;margin:0 auto;padding:8px 16px 24px}
  section{padding-top:32px}
  .sec-head{
    display:flex;
    align-items:baseline;
    flex-wrap:wrap;
    gap:4px 12px;
    margin-bottom:16px;
  }
  .sec-head h2{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:23px;
    color:var(--terracota);
    text-wrap:pretty;
  }
  .sec-sub{font-size:13px;font-weight:600;color:var(--texto2)}

  /* ====== Cards de producto ====== */
  .grilla{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:539px){.grilla{grid-template-columns:1fr}}

  .card{
    position:relative;
    background:var(--blanco);
    border:1px solid var(--borde);
    border-radius:16px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    transition:box-shadow .2s, transform .2s;
  }
  .card:hover{
    box-shadow:0 18px 40px -28px rgba(60,40,20,.5);
    transform:translateY(-2px);
  }
  /* Zona de foto (placeholder rayado, listo para <img>) */
  .foto{
    position:relative;
    height:96px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:repeating-linear-gradient(135deg, #F1E3C6 0 8px, #E7D4AC 8px 16px);
  }
  .foto img{width:100%;height:100%;object-fit:cover;display:block}
  .foto-ph{
    font-family:ui-monospace,Menlo,Consolas,monospace;
    font-size:11px;
    color:#9C8A6A;
    letter-spacing:.3px;
  }
  /* Etiqueta de precio tipo sticker */
  .precio-tag{
    position:absolute;
    top:8px;right:8px;
    background:var(--mostaza);
    color:var(--cacao);
    font-weight:800;
    font-size:13px;
    padding:4px 10px;
    border-radius:999px;
    box-shadow:0 2px 0 var(--mostaza-osc);
  }
  .card-body{
    padding:13px 15px 15px;
    display:flex;
    flex-direction:column;
    gap:7px;
    flex:1;
  }
  .nombre{
    font-family:'Zilla Slab',serif;
    font-weight:700;
    font-size:17px;
    color:var(--cacao);
    text-wrap:pretty;
  }
  .desc{
    font-size:12.5px;
    color:var(--texto2);
    line-height:1.4;
    text-wrap:pretty;
    flex:1;
  }
  /* Contador de cantidad */
  .stepper{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:4px;
  }
  .stepper button{
    width:30px;height:30px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:18px;
    font-weight:700;
    line-height:1;
    transition:transform .1s;
  }
  .stepper button:active{transform:scale(.9)}
  .stepper .menos{background:#F3EAD8;color:var(--terracota)}
  .stepper .mas{background:var(--terracota);color:#fff}
  .stepper .cant{
    min-width:18px;
    text-align:center;
    font-weight:800;
    font-size:15px;
    color:var(--cacao);
  }

  /* ====== Barra de pedido fija (carrito + WhatsApp) ====== */
  .barra-carrito{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:40;
    background:var(--albahaca);
    color:var(--marfil);
    display:none;
    box-shadow:0 -6px 20px rgba(60,40,20,.18);
  }
  .barra-carrito.visible{display:block}
  .barra-inner{
    max-width:680px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:15px 24px calc(15px + env(safe-area-inset-bottom));
  }
  .barra-resumen{font-weight:800;font-size:15px}
  .btn-pedir{
    background:var(--mostaza);
    color:var(--cacao);
    font-weight:800;
    font-size:14px;
    border-radius:12px;
    padding:11px 20px;
    box-shadow:0 3px 0 var(--mostaza-osc);
    white-space:nowrap;
    transition:transform .1s;
  }
  .btn-pedir:active{transform:translateY(2px);box-shadow:0 1px 0 var(--mostaza-osc)}

  /* ====== Drawer del pedido (preview antes de enviar) ====== */
  .overlay{
    position:fixed;inset:0;
    background:rgba(59,42,32,.5);
    z-index:50;
    opacity:0;pointer-events:none;
    transition:opacity .25s;
  }
  .overlay.abierto{opacity:1;pointer-events:auto}
  .drawer{
    position:fixed;
    left:0;right:0;bottom:0;
    z-index:60;
    background:var(--marfil);
    border-radius:20px 20px 0 0;
    max-height:90dvh;
    display:flex;
    flex-direction:column;
    transform:translateY(105%);
    transition:transform .3s cubic-bezier(.32,.72,.33,1);
  }
  .drawer.abierto{transform:translateY(0)}
  .drawer-mantel{overflow:hidden;border-radius:20px 20px 0 0}
  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 6px;
  }
  .drawer-head h3{font-family:'Zilla Slab',serif;font-weight:700;font-size:22px;color:var(--terracota)}
  .cerrar{
    width:36px;height:36px;
    border-radius:50%;
    background:#fff;
    border:1px solid var(--borde);
    font-size:16px;
    font-weight:800;
    color:var(--cacao);
  }
  .drawer-scroll{overflow-y:auto;padding:6px 20px 24px;flex:1}

  .item-pedido{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 0;
    border-bottom:1px solid var(--borde);
  }
  .item-emoji{font-size:1.5rem}
  .item-info{flex:1}
  .item-info .n{font-family:'Zilla Slab',serif;font-weight:700;font-size:15px;color:var(--cacao)}
  .item-info .p{font-size:13px;color:var(--albahaca);font-weight:700}
  .item-pedido .stepper{gap:10px}
  .item-pedido .stepper button{width:27px;height:27px;font-size:16px}

  .form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
  .campo label{
    display:block;
    font-size:12px;
    font-weight:800;
    margin-bottom:6px;
    color:var(--cacao);
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .campo input,.campo select,.campo textarea{
    width:100%;
    padding:12px 14px;
    border:1px solid var(--borde);
    border-radius:10px;
    background:#fff;
    font-family:inherit;
    font-size:15px;
    color:var(--cacao);
  }
  .campo textarea{resize:vertical;min-height:60px}
  .toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .toggle button{
    padding:12px;
    border-radius:10px;
    border:1px solid var(--borde);
    background:#fff;
    font-weight:700;
    font-size:14px;
    color:var(--cacao);
    transition:all .15s;
  }
  .toggle button.activo{
    background:var(--terracota);
    border-color:var(--terracota);
    color:#fff;
  }
  .oculto{display:none !important}

  .total-fila{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:18px;
    padding-top:14px;
    border-top:2px solid var(--borde);
  }
  .total-fila .t{font-weight:700;font-size:15px}
  .total-fila .m{font-family:'Zilla Slab',serif;font-weight:700;font-size:24px;color:var(--terracota)}

  .btn-wsp{
    margin-top:16px;
    width:100%;
    background:#25D366;
    color:#fff;
    border-radius:12px;
    padding:15px;
    font-weight:800;
    font-size:16px;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    box-shadow:0 3px 0 #1da851;
    transition:transform .1s;
  }
  .btn-wsp:active{transform:translateY(2px);box-shadow:0 1px 0 #1da851}
  .btn-wsp svg{width:20px;height:20px;fill:#fff}
  .aviso{
    text-align:center;
    font-size:12.5px;
    color:var(--texto2);
    margin-top:10px;
    padding-bottom:env(safe-area-inset-bottom);
  }

  footer{
    text-align:center;
    padding:28px 16px 36px;
    font-size:14px;
    color:var(--texto2);
  }

  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation:none !important}
    html{scroll-behavior:auto}
  }
</style>
</head>
<body>

<div class="mantel" aria-hidden="true"></div>

<header>
  <div class="logo">Pizzería</div>
  <p class="tagline">pizza al molde · horno de barro · masa artesanal</p>
  <div class="datos">
    <span>&#x1F557; 19:30–23:30</span>
    <span>&#x1F6F5; Delivery sin cargo</span>
    <span>&#x1F4CD; Zona centro</span>
  </div>
</header>

<div class="mantel" aria-hidden="true"></div>

<nav aria-label="Categorías">
  <div class="tabs" id="tabs"></div>
</nav>

<main id="menu"></main>

<footer>Hecho con &#x1F355; — Pedidos únicamente por WhatsApp</footer>

<!-- Barra de pedido fija -->
<div class="barra-carrito" id="barraCarrito">
  <div class="barra-inner">
    <span class="barra-resumen" id="barraResumen">0 ítems · $0</span>
    <button class="btn-pedir" id="btnVerPedido" type="button">Ver pedido</button>
  </div>
</div>

<!-- Drawer: preview / datos del pedido antes de enviar -->
<div class="overlay" id="overlay"></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-label="Tu pedido">
  <div class="drawer-mantel"><div class="mantel" aria-hidden="true"></div></div>
  <div class="drawer-head">
    <h3>Tu pedido</h3>
    <button class="cerrar" id="btnCerrar" aria-label="Cerrar">✕</button>
  </div>
  <div class="drawer-scroll">
    <div id="listaPedido"></div>

    <div class="form">
      <div class="campo">
        <label for="inpNombre">Tu nombre</label>
        <input id="inpNombre" type="text" placeholder="Ej: Juan" autocomplete="name">
      </div>
      <div class="campo">
        <label>Entrega</label>
        <div class="toggle">
          <button id="btnDelivery" class="activo" type="button">&#x1F6F5; Delivery</button>
          <button id="btnRetiro" type="button">&#x1F3E0; Retiro en local</button>
        </div>
      </div>
      <div class="campo" id="campoDireccion">
        <label for="inpDireccion">Dirección</label>
        <input id="inpDireccion" type="text" placeholder="Calle y número" autocomplete="street-address">
      </div>
      <div class="campo">
        <label for="selPago">Forma de pago</label>
        <select id="selPago">
          <option>Efectivo</option>
          <option>Transferencia</option>
          <option>Tarjeta (al recibir)</option>
        </select>
      </div>
      <div class="campo">
        <label for="inpNotas">Notas (opcional)</label>
        <textarea id="inpNotas" placeholder="Ej: sin aceitunas, tocar timbre B"></textarea>
      </div>
    </div>

    <div class="total-fila">
      <span class="t">Total</span>
      <span class="m" id="totalDrawer">$0</span>
    </div>

    <button class="btn-wsp" id="btnEnviar" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.5 14.4c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.49s1.07 2.89 1.22 3.09c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.7.63.71.23 1.36.2 1.87.12.57-.09 1.76-.72 2-1.41.25-.7.25-1.29.18-1.41-.08-.13-.28-.2-.58-.35M12.05 21.78h-.01a9.87 9.87 0 0 1-5.03-1.38l-.36-.21-3.74.98 1-3.65-.24-.37a9.86 9.86 0 0 1-1.51-5.26c0-5.45 4.44-9.88 9.9-9.88a9.84 9.84 0 0 1 7 2.9 9.83 9.83 0 0 1 2.89 7c0 5.45-4.44 9.88-9.9 9.88m8.42-18.3A11.82 11.82 0 0 0 12.05 0C5.5 0 .16 5.34.16 11.89c0 2.1.55 4.14 1.59 5.95L.06 24l6.3-1.65a11.88 11.88 0 0 0 5.68 1.45h.01c6.55 0 11.89-5.34 11.89-11.89 0-3.18-1.24-6.16-3.48-8.42"/></svg>
      Enviar pedido por WhatsApp
    </button>
    <p class="aviso">Se abre WhatsApp con tu pedido cargado, solo tenés que tocar enviar.</p>
  </div>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN DEL COMERCIO
   ⚠️ Reemplazar telefono por el número real del comercio,
   en formato internacional SIN el signo + (ej: 5492494123456)
============================================================ */
const CONFIG = {
  nombre: "Pizzería",
  telefono: "1133907596"
};

/* Catálogo: para usar foto real, reemplazar img:null por la URL
   de la imagen (ej: img:"fotos/muzzarella.jpg") */
const CATALOGO = [
  {
    id: "pizzas", nombre: "Pizzas", emoji: "\u{1F355}",
    sub: "Al molde, 8 porciones, salen con horno de barro",
    productos: [
      {id:"muzza",  nombre:"Muzzarella",    desc:"Salsa de tomate, muzzarella, aceitunas verdes y orégano.", precio:14000, emoji:"\u{1F355}", img:null},
      {id:"napo",   nombre:"Napolitana",    desc:"Muzzarella, rodajas de tomate fresco, ajo y perejil.", precio:16500, emoji:"\u{1F355}", img:null},
      {id:"fuga",   nombre:"Fugazzeta",     desc:"Doble muzzarella y montaña de cebolla. La de siempre.", precio:17000, emoji:"\u{1F355}", img:null},
      {id:"cala",   nombre:"Calabresa",     desc:"Muzzarella y longaniza calabresa en rodajas.", precio:17500, emoji:"\u{1F355}", img:null},
      {id:"4q",     nombre:"Cuatro Quesos", desc:"Muzzarella, roquefort, provolone y parmesano.", precio:19000, emoji:"\u{1F355}", img:null},
      {id:"esp",    nombre:"Especial de la casa", desc:"Jamón, morrones asados, huevo duro y aceitunas.", precio:18500, emoji:"\u{1F355}", img:null}
    ]
  },
  {
    id: "empanadas", nombre: "Empanadas", emoji: "\u{1F95F}",
    sub: "Horneadas, masa casera",
    productos: [
      {id:"emp-carne", nombre:"Carne cortada a cuchillo (x6)", desc:"Con huevo, aceituna y el toque de comino de la nona.", precio:9500, emoji:"\u{1F95F}", img:null},
      {id:"emp-jyq",   nombre:"Jamón y queso (x6)", desc:"Bien rellenas, queso que se estira.", precio:9500, emoji:"\u{1F95F}", img:null},
      {id:"emp-pollo", nombre:"Pollo (x6)", desc:"Pollo desmenuzado con verdeo y morrón.", precio:9500, emoji:"\u{1F95F}", img:null},
      {id:"emp-doc",   nombre:"Docena surtida", desc:"Elegimos las mejores de cada gusto. Avisanos preferencias en notas.", precio:18000, emoji:"\u{1F95F}", img:null}
    ]
  },
  {
    id: "faina", nombre: "Fainá", emoji: "\u{1FAD3}",
    sub: "De garbanzo, finita y dorada",
    productos: [
      {id:"faina-por", nombre:"Porción de fainá", desc:"El clásico caballo para tu porción de muzza.", precio:2500, emoji:"\u{1FAD3}", img:null},
      {id:"faina-ent", nombre:"Fainá entera", desc:"8 porciones recién salidas del horno.", precio:8000, emoji:"\u{1FAD3}", img:null}
    ]
  },
  {
    id: "bebidas", nombre: "Bebidas", emoji: "\u{1F964}",
    sub: "Bien frías",
    productos: [
      {id:"gaseosa", nombre:"Gaseosa 1.5L", desc:"Coca-Cola, Sprite o Fanta. Aclaranos cuál en notas.", precio:4500, emoji:"\u{1F964}", img:null},
      {id:"agua",    nombre:"Agua mineral 1.5L", desc:"Con o sin gas.", precio:3000, emoji:"\u{1F4A7}", img:null},
      {id:"birra",   nombre:"Cerveza 1L", desc:"Rubia bien helada, retornable no.", precio:5500, emoji:"\u{1F37A}", img:null},
      {id:"moscato", nombre:"Moscato 750ml", desc:"Porque pizza sin moscato es solo queso con pan.", precio:6500, emoji:"\u{1F377}", img:null}
    ]
  }
];

/* ============================================================
   MOTOR DEL CARRITO (no tocar para rebrandear)
============================================================ */
const carrito = {}; // id -> cantidad
let entrega = "Delivery";

const $ = s => document.querySelector(s);
const fmt = n => "$" + n.toLocaleString("es-AR");

const indiceProductos = {};
CATALOGO.forEach(c => c.productos.forEach(p => indiceProductos[p.id] = p));

/* ---- Render del menú ---- */
function renderMenu(){
  const tabs = $("#tabs"), main = $("#menu");
  CATALOGO.forEach((cat, i) => {
    const tab = document.createElement("button");
    tab.className = "tab" + (i===0 ? " activa" : "");
    tab.textContent = cat.emoji + " " + cat.nombre;
    tab.onclick = () => {
      document.getElementById("sec-"+cat.id).scrollIntoView({block:"start"});
      document.querySelectorAll(".tab").forEach(t=>t.classList.remove("activa"));
      tab.classList.add("activa");
    };
    tabs.appendChild(tab);

    const sec = document.createElement("section");
    sec.id = "sec-" + cat.id;
    sec.innerHTML = `<div class="sec-head"><h2>${cat.nombre}</h2><span class="sec-sub">${cat.sub}</span></div>`;
    const grilla = document.createElement("div");
    grilla.className = "grilla";
    cat.productos.forEach(p => grilla.appendChild(crearCard(p)));
    sec.appendChild(grilla);
    main.appendChild(sec);
  });
}

function crearCard(p){
  const card = document.createElement("article");
  card.className = "card";
  const foto = p.img
    ? `<img src="${p.img}" alt="${p.nombre}">`
    : `<span class="foto-ph">foto · ${p.nombre.toLowerCase()}</span>`;
  card.innerHTML = `
    <div class="foto">
      ${foto}
      <span class="precio-tag">${fmt(p.precio)}</span>
    </div>
    <div class="card-body">
      <div class="nombre">${p.nombre}</div>
      <div class="desc">${p.desc}</div>
      <div class="stepper">
        <button class="menos" aria-label="Quitar ${p.nombre}">−</button>
        <span class="cant" data-cant="${p.id}">0</span>
        <button class="mas" aria-label="Agregar ${p.nombre}">+</button>
      </div>
    </div>`;
  card.querySelector(".mas").onclick = () => cambiarCant(p.id, 1);
  card.querySelector(".menos").onclick = () => cambiarCant(p.id, -1);
  return card;
}

/* ---- Lógica de carrito ---- */
function cambiarCant(id, delta){
  carrito[id] = Math.max(0, (carrito[id] || 0) + delta);
  if (carrito[id] === 0) delete carrito[id];
  actualizarUI();
}

function totales(){
  let cant = 0, total = 0;
  for (const [id, c] of Object.entries(carrito)){
    cant += c;
    total += c * indiceProductos[id].precio;
  }
  return {cant, total};
}

function actualizarUI(){
  document.querySelectorAll("[data-cant]").forEach(el => {
    el.textContent = carrito[el.dataset.cant] || 0;
  });
  const {cant, total} = totales();
  $("#barraResumen").textContent = `${cant} ${cant === 1 ? "ítem" : "ítems"} · ${fmt(total)}`;
  $("#barraCarrito").classList.toggle("visible", cant > 0);
  $("#totalDrawer").textContent = fmt(total);
  if (cant === 0) cerrarDrawer();
  renderListaPedido();
}

/* ---- Lista de ítems dentro del drawer ---- */
function renderListaPedido(){
  const cont = $("#listaPedido");
  cont.innerHTML = "";
  for (const [id, c] of Object.entries(carrito)){
    const p = indiceProductos[id];
    const div = document.createElement("div");
    div.className = "item-pedido";
    div.innerHTML = `
      <span class="item-emoji">${p.emoji}</span>
      <div class="item-info">
        <div class="n">${p.nombre}</div>
        <div class="p">${fmt(p.precio * c)}</div>
      </div>
      <div class="stepper">
        <button class="menos" aria-label="Quitar">−</button>
        <span class="cant">${c}</span>
        <button class="mas" aria-label="Agregar">+</button>
      </div>`;
    div.querySelector(".mas").onclick = () => cambiarCant(id, 1);
    div.querySelector(".menos").onclick = () => cambiarCant(id, -1);
    cont.appendChild(div);
  }
}

/* ---- Drawer (preview + datos del pedido) ---- */
function abrirDrawer(){
  if (totales().cant === 0) return;
  $("#drawer").classList.add("abierto");
  $("#overlay").classList.add("abierto");
}
function cerrarDrawer(){
  $("#drawer").classList.remove("abierto");
  $("#overlay").classList.remove("abierto");
}
$("#btnVerPedido").onclick = abrirDrawer;
$("#btnCerrar").onclick = cerrarDrawer;
$("#overlay").onclick = cerrarDrawer;

/* ---- Toggle entrega (Delivery / Retiro en local) ---- */
$("#btnDelivery").onclick = () => setEntrega("Delivery");
$("#btnRetiro").onclick = () => setEntrega("Retiro");
function setEntrega(modo){
  entrega = modo;
  $("#btnDelivery").classList.toggle("activo", modo === "Delivery");
  $("#btnRetiro").classList.toggle("activo", modo === "Retiro");
  $("#campoDireccion").classList.toggle("oculto", modo !== "Delivery");
}

/* ---- Generar mensaje y enviar por WhatsApp ---- */
$("#btnEnviar").onclick = () => {
  const {cant, total} = totales();
  if (cant === 0) return;

  const nombre = $("#inpNombre").value.trim();
  if (!nombre){
    $("#inpNombre").focus();
    $("#inpNombre").style.borderColor = "var(--terracota)";
    return;
  }
  const direccion = $("#inpDireccion").value.trim();
  if (entrega === "Delivery" && !direccion){
    $("#inpDireccion").focus();
    $("#inpDireccion").style.borderColor = "var(--terracota)";
    return;
  }

  let mensaje = "¡Hola! Quiero hacer un pedido:\n\n";
  mensaje += `Nombre: ${nombre}\n`;
  mensaje += `${entrega === "Delivery" ? "Delivery — " + direccion : "Retiro en local"}\n\n`;
  for (const [id, c] of Object.entries(carrito)){
    const p = indiceProductos[id];
    mensaje += `• ${c}x ${p.nombre} — ${fmt(p.precio * c)}\n`;
  }
  mensaje += `\nTotal: ${fmt(total)}\n`;
  mensaje += `Pago: ${$("#selPago").value}\n`;
  const notas = $("#inpNotas").value.trim();
  if (notas) mensaje += `Notas: ${notas}\n`;
  mensaje += `\n¿Me confirman tiempo de entrega? ¡Gracias!`;

  const url = `https://wa.me/${CONFIG.telefono}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
};

renderMenu();
actualizarUI();
setEntrega("Delivery");

/* ---- Sincronizar tab activa con el scroll + sombra sticky ---- */
(function(){
  const nav = document.querySelector("nav");
  const tabsEl = document.getElementById("tabs");
  const secEls = CATALOGO.map(c => document.getElementById("sec-" + c.id));

  function activarTab(idx){
    document.querySelectorAll(".tab").forEach((t,i) => t.classList.toggle("activa", i===idx));
    const t = document.querySelectorAll(".tab")[idx];
    const tL = t.offsetLeft, tR = tL + t.offsetWidth;
    const cL = nav.scrollLeft, cR = cL + nav.clientWidth;
    if (tL < cL + 8) nav.scrollTo({left: tL - 8, behavior:"smooth"});
    else if (tR > cR - 8) nav.scrollTo({left: tR - nav.clientWidth + 8, behavior:"smooth"});
  }

  window.addEventListener("scroll", () => {
    nav.classList.toggle("pegada", nav.getBoundingClientRect().top <= 1);
    const lim = window.innerHeight / 3;
    let ai = 0;
    secEls.forEach((s,i) => { if (s.getBoundingClientRect().top <= lim) ai = i; });
    if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 4) ai = secEls.length - 1;
    activarTab(ai);
  }, {passive:true});
})();
</script>
